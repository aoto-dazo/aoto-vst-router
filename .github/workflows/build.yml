name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-9.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target AotoVSTRouter --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/AotoVSTRouter_artefacts/Release/Aoto VST Router.exe" dist/
          Copy-Item README.md dist/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AotoVSTRouter-Windows-x64
          path: dist/
